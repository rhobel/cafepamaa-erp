name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tests use transactions, which need a replica set. `services:` can't pass --replSet, so run it by hand.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 60); do
            docker exec mongo mongosh --quiet --eval '
              try { rs.status() } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }) }
              quit(db.hello().isWritablePrimary ? 0 : 1)' && exit 0
            sleep 1
          done
          docker logs mongo
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        env:
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/pamaa_test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (no push)
        run: docker build -t pamaa:ci .
